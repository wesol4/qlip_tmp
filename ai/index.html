<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLIP - AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #000;
            font-family: 'Didact Gothic', sans-serif;
            color: #fff;
            text-transform: uppercase;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            gap: 40px;
        }

        .logo-wrapper {
            width: 60%;
            max-width: 360px;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.4));
        }

        .video-wrapper {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer-text {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 1.1rem;
        }

        .footer-text a {
            color: #fff;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .footer-text a:hover {
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .logo-wrapper {
                width: 70%;
            }

            .footer-text {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                font-size: 0.85rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="page">
        <a href="/">
            <div class="logo-wrapper">
                <img src="/assets/qlip.png" alt="QLIP Logo">
            </div>
        </a>

        <div class="video-wrapper">
            <iframe
                src="https://www.youtube.com/embed/OnHAgiNMOlE?autoplay=1&rel=0&modestbranding=1"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer-text">
            <div>AI</div>
            <div><a href="mailto:production@qlipvfx.pl">production@qlipvfx.pl</a></div>
        </div>
    </div>

</body>
</html>
