<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLIP - Motion + VFX</title>
    <link href="https://fonts.google.com/specimen/Figtree?preview.script=Latn" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Didact Gothic', sans-serif;
            color: #fff;
            text-transform: uppercase;
        }

        /* Kontener wideo */
        .hero-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Responsywne wideo */
        .video-mobile { display: none; }
        @media (max-aspect-ratio: 1/1) {
            .video-desktop { display: none; }
            .video-mobile { display: block; }
        }

        /* Warstwa treści */
        .overlay {
            position: relative;
            z-index: 10;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Logo PNG na środku */
        .logo-wrapper {
            width: 80%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 2s ease-out forwards;
        }
        
        .logo-wrapper img {
            width: 100%;
            height: auto;
            /* Poprawa renderowania krawędzi dla plików graficznych */
            image-rendering: -webkit-optimize-contrast; 
            filter: drop-shadow(0px 4px 15px rgba(0,0,0,0.4));
        }

        /* Napisy w rogach */
        .footer-text {
            position: absolute;
            bottom: 40px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            letter-spacing: 2px;
            font-size: 2.1rem;
            z-index: 20;
        }

        .footer-text a {
            color: #fff;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .footer-text a:hover {
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .footer-text {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                bottom: 30px;
                font-size: 0.9rem;
                text-align: center;
            }
            .logo-wrapper {
                width: 90%;
            }
        }

        /* Animacja wejścia */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="hero-video-container">
        <video class="video-desktop" autoplay muted loop playsinline>
            <source src="https://kucharczuk.eu/qlip/pion.mp4" type="video/mp4">
        </video>
        <video class="video-mobile" autoplay muted loop playsinline>
            <source src="https://kucharczuk.eu/qlip/poziom.mp4" type="video/mp4">
        </video>
    </div>

    <main class="overlay">
        <div class="logo-wrapper">
            <img src="https://kucharczuk.eu/qlip/qlip.png" alt="QLIP Logo">
        </div>

        <div class="footer-text">
            <div>Motion + VFX</div>
            <div>Under Construction</div>
            <div><a href="mailto:production@qlipvfx.pl">production@qlipvfx.pl</a></div>
        </div>
    </main>

</body>
</html>
